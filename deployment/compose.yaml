name: norav2

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: norav2-api:0.1.0
    container_name: norav2-api
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      NORA_MODEL_PROFILE: ${NORA_MODEL_PROFILE:-development-default}
      CONVERSATION_EXPIRATION_SWEEP_INTERVAL_SECONDS: "${CONVERSATION_EXPIRATION_SWEEP_INTERVAL_SECONDS:-60}"
      CONVERSATION_EXPIRATION_SWEEP_BATCH_SIZE: "${CONVERSATION_EXPIRATION_SWEEP_BATCH_SIZE:-100}"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4.10
    container_name: norav2-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: norav2-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data: